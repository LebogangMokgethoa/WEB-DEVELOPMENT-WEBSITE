        <section class="page-header">
            <h2>Get Involved</h2>
            <p>Interested in adopting, volunteering, or becoming a sponsor? Fill in the form below and we'll get back to you.</p>
        </section>

          <section class="content-block">
            <form action="#" method="post">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required />

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required />

                <label for="enquiry-type">I'm interested in:</label>
                <select id="enquiry-type" name="enquiry-type">
                    <option value="adopt">Adopting a pet</option>
                    <option value="volunteer">Volunteering</option>
                    <option value="sponsor">Becoming a sponsor</option>
                </select>

                <lablel for="message">Message:</lablel>
                <textarea id="message" name="message" rows="5"></textarea>

                <button tpye="submit">Submit Enquiry</button>  
            </form>
